spring.application.name=rag
# ============ Spring AI 2.0 - OpenAI 兼容协议（LM Studio） ============
# LM Studio 默认本地服务地址
spring.ai.openai.base-url=http://localhost:1234/v1
# LM Studio 无需真实密钥，填写占位即可
spring.ai.openai.api-key=lm-studio
# 对话模型：google/gemma-4-e4b
# 注意：JIT 即时加载下，首次请求需加载 6.33GB 模型，耗时可能远超默认 60s 超时
# 默认 spring.ai.openai.timeout=60s，加载慢时导致超时抛错 -> 500，因此调大到 5 分钟
spring.ai.openai.timeout=300s
# 模型冷加载失败通常可以重试，但默认重试 3 次会进一步拉长等待，这里收敛为 1 次
spring.ai.openai.max-retries=1
spring.ai.openai.chat.options.model=google/gemma-4-e4b
spring.ai.openai.chat.options.temperature=0.7
# 向量嵌入模型：text-embedding-bge-m3
spring.ai.openai.embedding.options.model=text-embedding-bge-m3
# ============ Spring AI 2.0 - Milvus Vector Store（知识库） ============
spring.ai.vectorstore.milvus.client.host=localhost
spring.ai.vectorstore.milvus.client.port=19530
# 知识库集合名
spring.ai.vectorstore.milvus.collection-name=knowledge_base
# bge-m3 向量维度为 1024，需覆盖默认 1536
spring.ai.vectorstore.milvus.embedding-dimension=1024
# 显式开启自动建集合（2.0 起默认关闭）
spring.ai.vectorstore.milvus.initialize-schema=true
spring.ai.vectorstore.milvus.index-type=IVF_FLAT
spring.ai.vectorstore.milvus.metric-type=COSINE
# ============ Knife4j / OpenAPI 文档 ============
knife4j.enable=true
knife4j.setting.language=zh_cn
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
